<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Helpdesk &amp; Circular Portal - MRU</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }
    header {
      background: #0b3d91;
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; font-size: 1.8rem; }
    header p { margin: 0; opacity: 0.9; }
    nav {
      background: #082a66;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 12px 16px;
      font-weight: bold;
      font-size: 0.95rem;
      transition: background 0.25s;
    }
    nav a:hover { background: #f57c00; }
    .banner img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }
    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
    main { flex: 3; min-width: 300px; }
    aside {
      flex: 1;
      min-width: 240px;
      background: #fff;
      padding: 18px;
      border-radius: 8px;
      height: fit-content;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    section {
      background: #fff;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    h2 {
      color: #0b3d91;
      border-bottom: 2px solid #f57c00;
      padding-bottom: 6px;
      margin-top: 0;
    }
    article {
      border-left: 4px solid #f57c00;
      padding: 10px 14px;
      margin: 12px 0;
      background: #fafafa;
      border-radius: 0 4px 4px 0;
    }
    article h3 { margin: 0 0 4px; color: #0b3d91; font-size: 1.05rem; }
    article time { color: #666; font-size: 13px; display: block; margin-bottom: 6px; }
    article p { margin: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #0b3d91; color: #fff; }
    a { color: #0b3d91; }
    a:hover { color: #f57c00; }
