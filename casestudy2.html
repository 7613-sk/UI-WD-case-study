<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Services - MRU</title>
  <style>
    :root {
      --main: #0b3d91;
      --accent: #f57c00;
      --bg: #f0f4fa;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--main);
      color: #fff;
      padding: 12px 25px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h2 { margin: 0; font-size: 1.35rem; }
    header nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 500;
      transition: color 0.3s;
    }
    header nav a:hover { color: var(--accent); }
    .hero {
      text-align: center;
      padding: 70px 20px;
      color: #fff;
      background: linear-gradient(135deg, #0b3d91, #1976d2);
      animation: fade 1s ease;
    }
    .hero h1 { font-size: 2.4rem; margin: 0 0 10px; }
    .hero p { font-size: 1.05rem; opacity: 0.95; max-width: 600px; margin: 0 auto; }
    .hero a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      border-radius: 30px;
      text-decoration: none;
      transition: transform 0.3s, background 0.3s;
    }
    .hero a:hover { transform: scale(1.06); background: #e65100; }
    main { flex: 1; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #dde;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .card .icon { font-size: 42px; }
    .card h3 { color: var(--main); margin: 12px 0 8px; }
    .card p { color: #555; font-size: 0.95rem; margin: 0 0 16px; }
    .card button {
      background: none;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.25s, color 0.25s;
      align-self: center;
    }
    .card button:hover {
      background: var(--accent);
      color: #fff;
    }
    footer {
      background: #082a66;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      font-size: 0.95rem;
    }
    footer a { color: #ffb74d; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Modal Styles */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      animation: fade 0.25s ease;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .modal-header h3 { margin: 0; color: var(--main); }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
      line-height: 1;
    }
    .modal-body ul {
      padding-left: 20px;
      margin: 10px 0;
      line-height: 1.6;
    }
    .modal-footer {
      text-align: right;
      margin-top: 18px;
    }
    .modal-footer button {
      background: var(--main);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: none; }
    }
    @media (max-width: 600px) {
      header { flex-direction: column; gap: 8px; }
      header nav a { margin: 0 10px; }
      .hero h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <header id="home">
    <h2>MRU Student Services</h2>
    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Everything a Student Needs, in One Place</h1>
      <p>Quick access to library, transport, hostel, placements and examinations.</p>
      <a href="#services">Explore Services</a>
    </section>

    <section class="grid" id="services">
      <div class="card">
        <div>
          <div class="icon">📚</div>
          <h3>Library</h3>
          <p>Catalogue, e-books and timings.</p>
        </div>
        <button type="button" data-service="library">Open</button>
      </div>

      <div class="card">
        <div>
          <div class="icon">🚌</div>
          <h3>Transport</h3>
          <p>Bus routes and schedules.</
